# Increment-04: fine-tuned detector + ByteTrack. ONE variable vs configs/v0.yaml (detect.weights:
# COCO-pretrained -> SportsMOT-fine-tuned). Tracker (ByteTrack), inference imgsz (1280), conf/iou, and all
# else are identical, so any HOTA/DetA delta is attributable to the detector learning the athlete class.
# Note: the model is fine-tuned at imgsz 640 but inferred at 1280 (matches the baseline, isolating the
# weights variable); a small train/infer scale mismatch, called out in the writeup.

seed: 13

detect:
  model: yolo
  weights: weights/finetuned/best.pt   # <-- the one variable (v0.yaml: null = COCO yolov8m.pt)
  conf: 0.25
  iou: 0.7
  classes: [player, ball]
  device: mps
  imgsz: 1280
  batch: 16
  person_class: 0        # fine-tuned model: class 0 = athlete (single class)

track:
  method: bytetrack
  min_conf: 0.1
  use_reid: false
  track_thresh: 0.45
  match_thresh: 0.8
  track_buffer: 25

homography: {method: kalicalib, enabled: false}
reid: {model: osnet, enabled: false}
embedding: {enabled: false, arch: trajectory_transformer, dim: 128, objective: contrastive, window_seconds: 8}
retrieval: {enabled: false, index: faiss, top_k: 10}

eval:
  dataset: sportsmot
  data_dir: data/sportsmot
  split: basketball
  mot_split: val
  benchmark: SportsMOT
  metrics: [hota, mota, idf1]
  retrieval_ks: [1, 5, 10]
  out_dir: eval_results
  max_sequences: null
  max_frames: null
  cache_detections: true
  tracker_name: bytetrack_ft
