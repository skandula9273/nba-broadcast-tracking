name: eval-as-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev + test deps)
        run: pip install -e ".[dev,test]"   # torch/fastapi so the full suite runs (not the heavy [cv] stack)
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      # As stages land, add the cheap retrieval eval here so every PR reports recall@k deltas
      # (mirrors the SEC 'eval-as-CI' next-level move). HOTA needs data+GPU -> run out-of-band, commit JSON.
