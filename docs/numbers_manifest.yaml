# Numbers manifest — maps every quantitative README claim to its source-of-truth artifact.
# Checked by `make check-numbers` (src/hoopvec/eval/check_numbers.py) locally and in CI.
#
# Each `claims` entry:
#   id       : unique label
#   anchors  : exact README substrings that must ALL still be present (catches a silently-edited number)
#   artifact : the eval_results/*.json that produces the value (a SPECIFIC run == which run is cited)
#   path     : slash-separated JSON path; integer segments index lists  (e.g. results/sweeps/id_swap/4/...)
#              (slash, not dot — artifact keys like "coverage@0.25" contain dots)
#   derived  : instead of `path`, a computed value: {op: divide|subtract, of: <path>, by: <path>}
#   display  : the number as the README shows it
#   tol      : abs tolerance |artifact*scale - display| <= tol
#   scale    : optional multiplier applied to the artifact value before compare (100 for %, 1e-6 for M)
#   pin_reason: this claim deliberately cites a NON-latest run of its family (suppresses the stale-family
#              fail and documents WHY — an honest older-run citation, not staleness)
#
# `exempt`  : quantitative README numbers that are deliberately NOT eval_results-backed. Present-checked,
#             never value-checked. This list doubles as the audit's "unsourced, acknowledged" register.
# `ignore_patterns`: regexes for non-metric numbers (dates, versions, resolutions, structural counts) so the
#             unsourced audit doesn't drown in noise. Anything NOT covered by a claim/exempt/ignore is flagged.

readme: README.md
