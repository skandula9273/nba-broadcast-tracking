# Quantitative README numbers deliberately NOT backed by an eval_results metric. Present-checked only.
# This IS the "unsourced but acknowledged" register — review it; some are real findings (see the checker output).
exempt:
  - anchors: ["56 sole-author commits"]
    reason: >
      git commit count — not eval_results-backed AND structurally un-checkable: it changes on EVERY commit, so
      a hardcoded value can't stay consistent (enforcing it would fail CI on any commit that didn't bump it).
      FINDING: this value is stale (README says 56; `git rev-list --count HEAD` is far higher). RECOMMENDATION:
      drop the specific number from the README, or accept it as approximate. Present-checked only, never valued.
  - anchors: ["0.32–0.87"]
    reason: "re-ID appearance-cosine spread — prose from reid/identify.py, not a committed metric JSON."
  - anchors: ["**0.41 → 0.98**", "0.41 was on a corpus"]
    reason: "The WITHDRAWN 0.41 headline — the README explicitly documents it as wrong (duplicated-corpus bug); kept as a corrected-in-place note, not a live claim."
  - anchors: ["~0.94–1.0 at real jersey heights (median 63px)"]
    reason: "jersey-OCR accuracy is a curve across heights (jersey_accuracy_*.json); ~0.94-1.0 is a range summary, not one field. 63px IS value-checked."
  - anchors: ["hand-clicked homography (~30 ft off)"]
    reason: "inc-10 one-clip homography error — documented in docs/increment-10-end-to-end.md, not a metric JSON."
  - anchors: ["matches=320", "matches=251"]
    reason: "demo transcript (docs/demo-output.txt) NL-query match counts — a demo artifact, not an eval_results metric."
  - anchors: ["confidence=0.903", "confidence=0.643"]
    reason: "demo transcript per-query confidences (docs/demo-output.txt), not an eval_results metric."

# Non-metric numbers the unsourced audit should skip (dates, versions, resolutions, structural counts).
ignore_patterns:
  - '20\d\d'                          # years / dates (2026-07-29, 2015-16)
  - '3\.11'                           # python version
  - 'AGPL-3'                          # license id
  - '\b(1280|960|640|480|288|384)\b'  # detector inference resolutions (config knob, not a metric)
  - '@\d'                             # metric-@-k suffixes: recall@1, precision@5, r@10, id_swap indices
  - 'top-\d'                          # top-k
  - '\bV\d\b'                         # milestone labels V0/V1/V2
  - '\dD\b'                           # 2D / 3D
  - 'IDF\d'                           # tracking metric name IDF1
  - 'inc-\d'                          # increment references
  - 'increment-\d'
  - 'id_swap=\d'                      # a degradation-sweep severity label
  - 'Basketball-\d'                   # dataset name Basketball-51
  - '\d+ of \d+'                      # "~4 of 10" structural
  - '\d+ players'                     # "150 players" is anchored; catch other "N players" prose
  - '\d\. \*\*'                       # numbered highlight list markers "1. **", "2. **", "3. **"
  - 'yolov8'                          # model names
  - 'resnet\d'
  - 'v0'                              # config names (v0.yaml, v0_finetuned_640)
  - 'five-minute'
