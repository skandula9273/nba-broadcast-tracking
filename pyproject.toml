[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hooptrack"
version = "0.0.0"
description = "NBA broadcast -> tracking + play-embedding retrieval + a measured eval platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }  # inherited IF Ultralytics YOLO is used; revisit if RF-DETR/YOLOX chosen
authors = [{ name = "Santosh Kandula" }]

# Lower bounds only (honest re: not pinning to versions unverified here).
# Exact versions are frozen via `make lock` -> requirements.lock, which is committed.
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# The CV/ML stack. torch is environment-specific (CUDA build) — install per your GPU, then pin in the lock.
cv = [
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.2",   # AGPL — see license note. Swap for rfdetr / yolox to avoid AGPL.
  "boxmot>=10.0",       # ByteTrack / BoT-SORT / Deep-EIoU trackers + ReID
  "easyocr>=1.7",       # jersey-number OCR (re-ID individual identity)
]
retrieve = [
  "faiss-cpu>=1.8",     # or pgvector via psycopg (you know pgvector from SEC)
]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]
export = [
  # V2 inference-format optimization (make detect-export-bench): export the detector to ONNX/CoreML and
  # measure latency vs PyTorch/MPS. coremltools targets the Apple ANE/GPU; onnxruntime carries the CoreML EP.
  "onnx>=1.16",
  "onnxruntime>=1.18",   # provides CoreMLExecutionProvider on Apple Silicon
  "coremltools>=8.0",
]
track = [
  # TrackEval is installed from git (not on PyPI in a stable form):
  #   pip install git+https://github.com/JonathonLuiten/TrackEval.git
]
obs = [
  "wandb>=0.17",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
# Minimal deps for the full test suite to run (the CI 'eval-as-ci' gate installs .[dev,test]). torch is needed
# because retrieve/ modules import it at load; fastapi/httpx for the serve tests. NOT the full [cv] stack
# (ultralytics/boxmot/easyocr are lazy-imported and not exercised by unit tests) — keeps CI fast.
test = [
  "torch>=2.2",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hooptrack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
